[package]
name = "pryx-base"
version = "0.1.0"
edition = "2024"
publish = false

# Foundational layer of the pryx application core: the downward-closed set of
# modules (provider, auth, config, session, message, memory, telemetry, ...)
# that the server/tool/agent layer depends on. Split out of `pryx-app-core` so
# the two halves compile as separate rustc units, halving peak compile memory.
# `pryx-app-core` re-exports this crate (`pub use pryx_base::*`) so that every
# existing `crate::<module>` path keeps resolving unchanged.

[lib]
name = "pryx_base"
path = "src/lib.rs"

[dependencies]
# Memory allocator (reduces fragmentation for long-running server)
tikv-jemalloc-ctl = { version = "0.6", optional = true }
tikv-jemalloc-sys = { version = "0.6", optional = true }

# Async runtime
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "charset", "http2", "system-proxy", "rustls-tls", "rustls-tls-native-roots"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
toml = "0.8"

# File operations

# Utilities
dirs = "5"               # home directory
anyhow = "1"
libc = "0.2"             # Unix system calls (flock)
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
urlencoding = "2"        # URL encoding for web search
uuid = { version = "1", features = ["v4", "v5"] }
proctitle = "0.1"

# Embeddings (local inference) - behind feature flag (163 crates, slow to compile)
pryx-embedding = { path = "../pryx-embedding", optional = true }
pryx-gateway-types = { path = "../pryx-gateway-types" }
pryx-import-core = { path = "../pryx-import-core" }
pryx-logging = { path = "../pryx-logging" }

# OAuth
base64 = "0.22"
sha2 = "0.10"
pryx-transport = { path = "../pryx-transport" }
rand = "0.9.3"
hex = "0.4"
url = "2"
open = "5"               # Open URLs in browser
pryx-auth-types = { path = "../pryx-auth-types" }
pryx-azure-auth = { path = "../pryx-azure-auth" }
pryx-agent-runtime = { path = "../pryx-agent-runtime" }
pryx-provider-metadata = { path = "../pryx-provider-metadata" }
pryx-provider-env = { path = "../pryx-provider-env" }
pryx-provider-core = { path = "../pryx-provider-core" }
# default-features=false so this crate's `bedrock` feature (below) controls the
# AWS SDK stack; the pure model-metadata/credential-detection layer is always on.
pryx-provider-bedrock = { path = "../pryx-provider-bedrock", default-features = false }
pryx-provider-antigravity = { path = "../pryx-provider-antigravity" }
pryx-provider-copilot = { path = "../pryx-provider-copilot" }
pryx-provider-openai = { path = "../pryx-provider-openai" }
pryx-provider-openrouter = { path = "../pryx-provider-openrouter" }
pryx-provider-gemini = { path = "../pryx-provider-gemini" }
# NOTE: this foundation layer intentionally does NOT depend on any `pryx-tui-*`
# crate. The two pure-data/string symbols it used to reach for (`ResumeTarget`,
# `reasoning_line_markup`) were moved to `pryx-session-types` and
# `pryx-render-core` respectively, so the layering inversion (foundation
# depending on presentation) is gone.
pryx-render-core = { path = "../pryx-render-core" }
pryx-terminal-launch = { path = "../pryx-terminal-launch" }
pryx-terminal-image = { path = "../pryx-terminal-image" }
pryx-telemetry-core = { path = "../pryx-telemetry-core" }
pryx-usage-types = { path = "../pryx-usage-types" }

# Streaming

# Terminal I/O (event stream for interactive auth/secret prompts). NOTE: the
# heavier presentation deps (ratatui widgets, arboard clipboard) were dropped
# from this foundation layer; they are unused here and live only in `pryx-tui`.
crossterm = { version = "0.29", features = ["event-stream"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }  # Only PNG/JPEG (skip avif/rav1e, exr, gif, tiff, etc)

# NOTE: PDF text extraction (pryx-pdf) lives in the upper pryx-app-core crate
# (tool/read.rs), not here.
pryx-background-types = { path = "../pryx-background-types" }
pryx-batch-types = { path = "../pryx-batch-types" }
pryx-build-meta = { path = "../pryx-build-meta" }
pryx-compaction-core = { path = "../pryx-compaction-core" }
pryx-config-types = { path = "../pryx-config-types" }
pryx-core = { path = "../pryx-core" }
pryx-memory-types = { path = "../pryx-memory-types" }
pryx-message-types = { path = "../pryx-message-types" }
pryx-plan = { path = "../pryx-plan" }
pryx-protocol = { path = "../pryx-protocol" }
pryx-session-types = { path = "../pryx-session-types" }
pryx-storage = { path = "../pryx-storage" }
pryx-task-types = { path = "../pryx-task-types" }
pryx-tool-core = { path = "../pryx-tool-core" }
pryx-tool-types = { path = "../pryx-tool-types" }
pryx-side-panel-types = { path = "../pryx-side-panel-types" }

# Gzip decoding (used by provider import/helpers)
tempfile = "3"
qrcode = { version = "0.14.1", default-features = false }

[features]
default = ["embeddings", "bedrock"]
# Compiles the in-crate test helpers (storage::lock_test_env,
# auth::test_sandbox, bus::reset_models_updated_publish_state_for_tests, ...) as
# `pub` so downstream crates' test targets can reach them. Enabled as a
# dev-dependency feature by pryx-app-core / pryx / etc.; never in normal
# (non-test) builds.
test-support = []
jemalloc = [
    "dep:tikv-jemalloc-ctl",
    "dep:tikv-jemalloc-sys",
    "tikv-jemalloc-ctl/stats",
]
jemalloc-prof = [
    "jemalloc",
    "tikv-jemalloc-ctl/profiling",
]
embeddings = ["dep:pryx-embedding"]
# Live AWS Bedrock support (the ~20-crate AWS SDK stack) lives in
# pryx-provider-bedrock (aws-sdk); forward there. Without it the Bedrock
# provider still compiles but live calls return an explanatory error.
bedrock = ["pryx-provider-bedrock/aws-sdk"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.7"

[dev-dependencies]
# Dev-only cycle (cargo permits dev-dependencies on dependents): base's
# MultiProvider routing tests exercise the real OpenRouter/OpenAI-compatible
# runtime through the composition-root registry, exactly like the binary.
pryx-provider-openrouter-runtime = { path = "../pryx-provider-openrouter-runtime" }
