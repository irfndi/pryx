[package]
name = "pryx-harness-api-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Harness API endpoint: bridges versioned API clients onto the internal pryx protocol"

[dependencies]
anyhow = "1"
pryx-harness-api = { path = "../pryx-harness-api" }
pryx-transport = { path = "../pryx-transport" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The parser in `background_progress` reads markdown produced by the daemon's
# own formatter, so the contract test builds that formatter rather than a copy
# of its output: a change to the wire prose then fails here instead of silently
# turning every client's progress bar off. Dev-only, so the bridge binary stays
# free of the application foundation.
pryx-base = { path = "../pryx-base", default-features = false }
pryx-background-types = { path = "../pryx-background-types" }

[[bin]]
name = "pryx-harness-api-bridge"
path = "src/bin/bridge.rs"
