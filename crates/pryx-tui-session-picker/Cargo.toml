[package]
name = "pryx-tui-session-picker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
pryx-message-types = { path = "../pryx-message-types" }
pryx-session-types = { path = "../pryx-session-types" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
