[package]
name = "pryx-tui-permissions"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "pryx_tui_permissions"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
crossterm = { version = "0.29", features = ["event-stream"] }
pryx-base = { path = "../pryx-base", default-features = false }
pryx-core = { path = "../pryx-core" }
pryx-tui-style = { path = "../pryx-tui-style" }
ratatui = "0.30"
serde_json = "1"
