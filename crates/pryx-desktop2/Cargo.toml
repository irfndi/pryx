[package]
name = "pryx-desktop2"
version = "0.1.0"
edition = "2024"
publish = false
description = "Greenfield pryx desktop app: winit + wgpu + Vello + Parley over the harness API"
build = "build.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pryx-build-meta = { path = "../pryx-build-meta" }
pryx-math = { path = "../pryx-math" }
pryx-sdk = { path = "../pryx-sdk" }
pryx-render-core = { path = "../pryx-render-core" }
libc = "0.2"
libloading = "0.8"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
unicode-width = "0.2"
parley = "0.11"
pollster = "0.3"
serde_json = "1"
vello = "0.9"
winit = "0.30"

[lib]
name = "pryx_desktop2"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[[bin]]
name = "pryx-desktop2"
path = "src/main.rs"
