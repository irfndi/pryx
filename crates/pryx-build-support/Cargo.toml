[package]
name = "pryx-build-support"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
pryx-core = { path = "../pryx-core" }
pryx-selfdev-types = { path = "../pryx-selfdev-types" }
pryx-storage = { path = "../pryx-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
