[package]
name = "pryx-tool-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "pryx_tool_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
pryx-agent-runtime = { path = "../pryx-agent-runtime" }
pryx-message-types = { path = "../pryx-message-types" }
pryx-tool-types = { path = "../pryx-tool-types" }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
