[package]
name = "pryx-provider-doctor"
version = "0.1.0"
edition = "2024"
publish = false

# Provider diagnostics that sit downstream of pryx-base: the strict
# `pryx provider-doctor` end-to-end runner (provider_e2e), the live provider
# probes it drives, and the auth-lifecycle contract driver. Split out of
# pryx-base so edits to the doctor cluster no longer rebuild the
# base -> app-core -> tui spine, and base compiles faster with lower peak
# memory.

[lib]
name = "pryx_provider_doctor"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

# default-features = false: the doctor only needs base's always-on surface
# (auth, provider runtimes, provider_catalog, live_tests). Feature unification
# in the root binary re-enables embeddings/bedrock there.
pryx-base = { path = "../pryx-base", default-features = false }
pryx-provider-gemini-runtime = { path = "../pryx-provider-gemini-runtime" }
pryx-provider-anthropic-runtime = { path = "../pryx-provider-anthropic-runtime" }
pryx-provider-openai-runtime = { path = "../pryx-provider-openai-runtime" }
pryx-provider-openrouter-runtime = { path = "../pryx-provider-openrouter-runtime" }
pryx-provider-cursor-runtime = { path = "../pryx-provider-cursor-runtime" }
pryx-provider-antigravity-runtime = { path = "../pryx-provider-antigravity-runtime" }
pryx-provider-copilot-runtime = { path = "../pryx-provider-copilot-runtime" }

[dev-dependencies]
# The auth-lifecycle driver tests run inside pryx-base's auth test sandbox.
pryx-base = { path = "../pryx-base", default-features = false, features = ["test-support"] }
pryx-provider-metadata = { path = "../pryx-provider-metadata" }
tokio = { version = "1", features = ["macros", "rt"] }
