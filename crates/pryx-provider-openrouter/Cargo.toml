[package]
name = "pryx-provider-openrouter"
version = "0.1.0"
edition = "2024"

[dependencies]
pryx-schema-dialect = { path = "../pryx-schema-dialect" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
futures = "0.3"
pryx-core = { path = "../pryx-core" }
pryx-logging = { path = "../pryx-logging" }
pryx-message-types = { path = "../pryx-message-types" }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
